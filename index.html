<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Atlas — Project Operations</title>
    <link rel="preload" href="/fonts/tajawal/Tajawal-Regular.v1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/tajawal/Tajawal-Medium.v1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/tajawal/Tajawal-Bold.v1.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function() {
        var stored = null;
        var locale = null;
        try {
          stored = localStorage.getItem('atlas-theme');
          locale = localStorage.getItem('atlas-locale');
        } catch (error) {
          // Browser storage is optional; system preferences still provide defaults.
        }
        var theme = stored === 'light' || stored === 'dark' ? stored : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);

        var lang = 'en';
        var dir = 'ltr';
        if (locale === 'ar') { lang = 'ar'; dir = 'rtl'; }
        else if (locale !== 'en') {
          var preferred = (navigator.languages || [navigator.language]);
          for (var i = 0; i < preferred.length; i++) {
            if (preferred[i].split('-')[0] === 'ar') { lang = 'ar'; dir = 'rtl'; break; }
          }
        }
        document.documentElement.lang = lang;
        document.documentElement.dir = dir;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
